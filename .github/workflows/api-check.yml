# Diagnostic: what does automatic eBay sold-comp data actually require?
#
# eBay sold listings are the ground truth for graded slabs. This establishes
# which endpoint carries them, what authentication it needs, and whether a
# browser can call it at all — which decides whether the dashboard can do this
# alone or needs something server-side holding a credential.
#
# Run from the Actions tab → "Price API check" → Run workflow.
name: Price API check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Marketplace Insights - the sold-items endpoint
        run: |
          echo "=== item_sales/search, no token ==="
          curl -sS -o /tmp/mi.json -w 'HTTP %{http_code}\n' \
            'https://api.ebay.com/buy/marketplace_insights/v1_beta/item_sales/search?q=charizard%20psa%2010&limit=1' || true
          head -c 400 /tmp/mi.json; echo

      - name: Can a browser call eBay at all?
        run: |
          for path in \
            'buy/marketplace_insights/v1_beta/item_sales/search' \
            'buy/browse/v1/item_summary/search'; do
            echo "=== CORS preflight: $path ==="
            curl -sS -D - -o /dev/null -X OPTIONS \
              -H 'Origin: https://michaelgold222.github.io' \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization' \
              "https://api.ebay.com/$path" | tr -d '\r' \
              | grep -iE '^(HTTP/|access-control-)' || echo "  no access-control headers -> a browser cannot call this"
            echo
          done

      - name: Is the OAuth token endpoint browser-callable?
        run: |
          echo "=== oauth2/token preflight ==="
          curl -sS -D - -o /dev/null -X OPTIONS \
            -H 'Origin: https://michaelgold222.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            'https://api.ebay.com/identity/v1/oauth2/token' | tr -d '\r' \
            | grep -iE '^(HTTP/|access-control-)' || echo "  no access-control headers"

      - name: Any open aggregator carrying eBay solds?
        run: |
          probe() {
            printf '%-46s -> HTTP %s\n' "$1" \
              "$(curl -sS -m 12 -o /tmp/a.json -w '%{http_code}' "$2" 2>/dev/null || echo 'unreachable')"
            head -c 160 /tmp/a.json 2>/dev/null; echo; echo
          }
          probe 'cardladder public'  'https://api.cardladder.com/v1/search?q=charizard'
          probe '130point'           'https://back.130point.com/sales/?query=charizard+psa+10'
          probe 'tcgplayer api'      'https://api.tcgplayer.com/catalog/categories'
