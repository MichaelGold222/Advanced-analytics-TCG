# Diagnostic: read Card Hedge's OpenAPI spec.
#
# It lists every endpoint and response field, which settles the decisive
# question: does the API serve individual completed sales (date + price per
# grade), or only an aggregate price? The valuation here is a median of the
# last five real sales, so an aggregate alone cannot feed it.
#
# Run from the Actions tab → "Price API check" → Run workflow.
name: Price API check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the OpenAPI spec
        run: |
          for u in 'https://ai.cardhedger.com/v1/agent/docs' \
                   'https://ai.cardhedger.com/v1/agent/openapi.json' \
                   'https://ai.cardhedger.com/openapi.json'; do
            printf '%-52s -> %s\n' "$u" \
              "$(curl -sSL -m 15 -o /tmp/try.json -w '%{http_code}' -H 'Accept: application/json' "$u" 2>/dev/null || echo err)"
            if head -c 1 /tmp/try.json 2>/dev/null | grep -q '{'; then cp /tmp/try.json /tmp/spec.json; echo "  ^ JSON captured"; fi
          done

      - name: Every endpoint the spec declares
        run: |
          if [ ! -s /tmp/spec.json ]; then echo "no JSON spec retrieved"; exit 0; fi
          echo "=== paths ==="
          jq -r '.paths | keys[]' /tmp/spec.json 2>/dev/null | head -40 || echo "not an OpenAPI doc"
          echo
          echo "=== summaries ==="
          jq -r '.paths | to_entries[] | "\(.key): \(.value | to_entries[0].value.summary // "")"' /tmp/spec.json 2>/dev/null | head -40 || true

      - name: Does any response carry individual sales?
        run: |
          if [ ! -s /tmp/spec.json ]; then echo "no spec"; exit 0; fi
          echo "=== schema property names mentioning sales, dates or grades ==="
          jq -r '[paths(scalars) as $p | $p | join(".")] | .[]' /tmp/spec.json 2>/dev/null \
            | grep -oiE '[a-z_]*(sale|sold|history|transaction|date|grade|psa|cert)[a-z_]*' \
            | sort -u | head -40 || echo "none"
          echo
          echo "=== raw keyword counts in the spec ==="
          for kw in sale sold history transaction date grade cert population price; do
            printf '%-14s %s\n' "$kw" "$(grep -oic "$kw" /tmp/spec.json || echo 0)"
          done

      - name: Pricing tiers, and can a browser call it?
        run: |
          echo "=== /v1/agent/pricing ==="
          curl -sSL -m 15 -H 'Accept: application/json' 'https://ai.cardhedger.com/v1/agent/pricing' | head -c 900; echo
          echo
          echo "=== prices-by-cert without a key ==="
          curl -sSL -m 15 -o /tmp/c.json -w 'HTTP %{http_code}\n' \
            'https://ai.cardhedger.com/v1/agent/cards/prices-by-cert?cert=12345678' || true
          head -c 300 /tmp/c.json; echo
          echo
          echo "=== CORS preflight ==="
          curl -sS -m 15 -D - -o /dev/null -X OPTIONS \
            -H 'Origin: https://michaelgold222.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization' \
            'https://ai.cardhedger.com/v1/agent/cards/prices-by-cert' | tr -d '\r' \
            | grep -iE '^(HTTP/|access-control-)' || echo "  none -> needs a server to relay"
