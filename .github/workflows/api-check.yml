# Diagnostic: does the graded-price path actually work end to end?
#
# EVERY STEP HERE SPENDS THE OWNER'S CREDITS, and the plan is 200 a month. Four
# runs in ten minutes emptied the balance, roughly half of it on re-asking the
# picture questions that run 27 had already answered and written into
# CLAUDE.md. Pick the probes you need with the `probes` input — the default is
# prices only — and read CLAUDE.md before asking the API anything, because the
# answer is probably already in there. Batch every open question into ONE run.
#
# Runs the same sequence the dashboard runs — resolve the callable scraper,
# then price a cert — and prints what comes back, so a failure can be told
# apart from an empty result.
#
# Run from the Actions tab -> "Price API check" -> Run workflow.
name: Price API check

on:
  workflow_dispatch:
    inputs:
      cert:
        description: Certificate numbers to price, comma separated
        required: false
        default: '93083876'
      grader:
        description: PSA, BGS, CGC or SGC
        required: false
        default: PSA
      card_name:
        description: >-
          A card to look up BY NAME rather than by cert, e.g. "Playing in the
          Sea Pikachu". The sales history belongs to the card at a grade, not
          to a slab, so this is the lookup that matters when a cert carries no
          card id. Used by the depth probe.
        required: false
        default: ''
      probes:
        description: >-
          Which questions to ask, comma separated. Each one spends the owner's
          credits, so ask only what is not already written down in CLAUDE.md.
          prices (3 credits) | pictures (7) | depth (3) | all
        required: false
        default: prices

env:
  BASE: https://api.parse.bot
  ORIGIN: https://michaelgold222.github.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight on the endpoints the dashboard would call
        run: |
          for p in '/dispatch/tasks' '/scraper/x/get_cert_values_bulk' '/scraper/x/search_by_certs_bulk'; do
            printf '\n=== OPTIONS %s ===\n' "$p"
            curl -sS -m 20 -D - -o /dev/null -X OPTIONS \
              -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: x-api-key,content-type' \
              "$BASE$p" | tr -d '\r' \
              | grep -iE '^(HTTP/|access-control-)' || echo '  no access-control headers'
          done

      - name: Walk the whole flow
        env:
          PROBES: ${{ inputs.probes }}
          KEY: ${{ secrets.PARSE_API_KEY }}
          CERT: ${{ inputs.cert }}
          GRADER: ${{ inputs.grader }}
        run: |
          case ",$PROBES," in *,all,*|*,prices,*) ;; *) echo "skipped — not in '$PROBES'"; exit 0 ;; esac
          if [ -z "$KEY" ]; then
            echo "PARSE_API_KEY secret is not set; nothing to test."
            exit 0
          fi

          echo "=== 1. list tasks ==="
          code=$(curl -sS -m 30 -o tasks.json -w '%{http_code}' \
            -H "X-API-Key: $KEY" -H "Origin: $ORIGIN" "$BASE/dispatch/tasks?limit=100")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "--- body ---"; head -c 800 tasks.json; echo
            echo "STOP: the key itself was refused or the endpoint moved."
            exit 1
          fi
          python3 -c "
          import json
          d = json.load(open('tasks.json'))
          tasks = d.get('tasks', d) if isinstance(d, dict) else d
          print('tasks returned:', len(tasks))
          for t in tasks[:20]:
              print(' ', t.get('id'), '|', t.get('slug'), '|', t.get('name'), '|', t.get('status'))
          "

          echo
          echo "=== 2. find the Card Ladder task ==="
          TASK=$(python3 -c "
          import json, re, sys
          d = json.load(open('tasks.json'))
          tasks = d.get('tasks', d) if isinstance(d, dict) else d
          for t in tasks:
              blob = ' '.join(str(t.get(k, '')) for k in ('slug', 'url', 'name'))
              if re.search('cardladder', blob, re.I):
                  print(t.get('id')); sys.exit()
          ")
          if [ -z "$TASK" ]; then
            echo "STOP: no Card Ladder API on this Parse account."
            exit 1
          fi
          echo "task id: $TASK"

          echo
          echo "=== 3. resolve the callable scraper ==="
          curl -sS -m 30 -o detail.json -H "X-API-Key: $KEY" "$BASE/dispatch/tasks/$TASK"
          python3 -c "
          import json
          d = json.load(open('detail.json'))
          print('keys:', sorted(d)[:25])
          print('status:', d.get('status'))
          print('result_scraper_id:', d.get('result_scraper_id'))
          print('scraper_id:', d.get('scraper_id'))
          "
          SCR=$(python3 -c "
          import json
          d = json.load(open('detail.json'))
          print(d.get('result_scraper_id') or d.get('scraper_id') or '')
          ")
          if [ -z "$SCR" ]; then
            echo "STOP: that API has not finished building."
            exit 1
          fi

          echo
          echo "=== 4. what endpoints does it expose? ==="
          curl -sS -m 30 -o spec.json -H "X-API-Key: $KEY" "$BASE/v1/apis/$SCR/openapi.json" || true
          python3 -c "
          import json
          try:
              d = json.load(open('spec.json'))
          except Exception as e:
              print('could not read the spec:', e); raise SystemExit
          for p, ops in sorted(d.get('paths', {}).items()):
              print(' ', ','.join(sorted(ops)).upper(), p)
          " || true

          echo
          echo "=== 5. price certs: $CERT ($GRADER) ==="
          python3 -c "
          import json, os
          certs = [c.strip() for c in os.environ['CERT'].replace(chr(10), ',').split(',') if c.strip()]
          json.dump({'certs': [{'cert_number': c, 'grading_company': os.environ['GRADER']} for c in certs]},
                    open('req.json', 'w'))
          print('asking for', len(certs), 'certs')
          "
          code=$(curl -sS -m 300 -o bulk.json -w '%{http_code}' -D bulk.head \
            -X POST -H "X-API-Key: $KEY" -H 'Content-Type: application/json' -H "Origin: $ORIGIN" \
            -d @req.json "$BASE/scraper/$SCR/get_cert_values_bulk")
          echo "HTTP $code"
          tr -d '\r' < bulk.head | grep -iE '^(x-credits|x-ratelimit|access-control-allow-origin)' || true
          echo "--- body (first 600 chars) ---"
          head -c 600 bulk.json; echo
          python3 -c "
          import json, os
          asked = [c.strip() for c in os.environ['CERT'].replace(chr(10), ',').split(',') if c.strip()]
          try:
              d = json.load(open('bulk.json'))
          except Exception:
              print('body was not JSON'); raise SystemExit
          results = (d.get('data') or {}).get('results') if isinstance(d, dict) else None
          if results is None:
              print('no data.results key; top-level keys:', sorted(d) if isinstance(d, dict) else type(d))
              raise SystemExit
          print()
          print('asked for', len(asked), '- got', len(results), 'results')
          by = {str(r.get('cert_number')): r for r in results}
          for c in asked:
              r = by.get(c)
              if r is None:
                  print('  ', c.ljust(12), 'ABSENT from the response')
              else:
                  n = len(r.get('recent_sales') or [])
                  print('  ', c.ljust(12), n, 'sales, last', r.get('last_sale_price'))
          print()
          print('errors field:', json.dumps((d.get('data') or {}).get('errors'))[:400])
          " || true

      - name: Does anything return a picture?
        env:
          PROBES: ${{ inputs.probes }}
          KEY: ${{ secrets.PARSE_API_KEY }}
          CERT: ${{ inputs.cert }}
          GRADER: ${{ inputs.grader }}
        run: |
          case ",$PROBES," in *,all,*|*,pictures,*) ;; *) echo "skipped — not in '$PROBES'"; exit 0 ;; esac
          [ -n "$KEY" ] || exit 0
          SCR=$(python3 -c "
          import json
          d = json.load(open('detail.json'))
          print(d.get('result_scraper_id') or d.get('scraper_id') or '')
          ")
          [ -n "$SCR" ] || exit 0
          ONE=$(python3 -c "
          import os
          print([c.strip() for c in os.environ['CERT'].replace(chr(10), ',').split(',') if c.strip()][0])
          ")

          Q="cert_number=$ONE&grading_company=$GRADER"
          for ep in "get_cert_full_profile?$Q" "search_by_cert?$Q"; do
            printf '\n=== GET %s ===\n' "${ep%%\?*}"
            code=$(curl -sS -m 120 -o prof.json -w '%{http_code}' \
              -H "X-API-Key: $KEY" "$BASE/scraper/$SCR/$ep")
            echo "HTTP $code"
            python3 -c "
          import json, re
          try:
              d = json.load(open('prof.json'))
          except Exception:
              print('not JSON:', open('prof.json').read()[:200]); raise SystemExit

          found = []
          def walk(node, path=''):
              if isinstance(node, dict):
                  for k, v in node.items():
                      walk(v, path + '/' + str(k))
              elif isinstance(node, list):
                  for i, v in enumerate(node[:3]):
                      walk(v, path + '[' + str(i) + ']')
              elif isinstance(node, str):
                  if re.search(r'(https?://\S+\.(?:jpg|jpeg|png|webp))|image|photo|img', node, re.I) or re.search(r'image|photo|img|thumb', path, re.I):
                      found.append((path, node[:160]))
          walk(d)
          print('top-level keys:', sorted(d) if isinstance(d, dict) else type(d))
          if found:
              print('image-ish fields:')
              for p, v in found[:15]:
                  print('  ', p, '=', v)
          else:
              print('no image-ish fields found')
              print('sample:', json.dumps(d)[:500])
          " || true
          done

      - name: Can pictures be had in bulk?
        env:
          PROBES: ${{ inputs.probes }}
          KEY: ${{ secrets.PARSE_API_KEY }}
          CERT: ${{ inputs.cert }}
          GRADER: ${{ inputs.grader }}
        run: |
          case ",$PROBES," in *,all,*|*,pictures,*) ;; *) echo "skipped — not in '$PROBES'"; exit 0 ;; esac
          [ -n "$KEY" ] || exit 0
          SCR=$(python3 -c "
          import json
          d = json.load(open('detail.json'))
          print(d.get('result_scraper_id') or d.get('scraper_id') or '')
          ")
          [ -n "$SCR" ] || exit 0
          python3 -c "
          import json, os
          certs = [c.strip() for c in os.environ['CERT'].replace(chr(10), ',').split(',') if c.strip()]
          json.dump({'certs': [{'cert_number': c, 'grading_company': os.environ['GRADER']} for c in certs]},
                    open('req.json', 'w'))
          "
          echo "=== POST search_by_certs_bulk ==="
          code=$(curl -sS -m 300 -o blk.json -w '%{http_code}' -D blk.head \
            -X POST -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d @req.json "$BASE/scraper/$SCR/search_by_certs_bulk")
          echo "HTTP $code"
          tr -d '\r' < blk.head | grep -iE '^x-credits-charged' || true
          python3 -c "
          import json, re
          try:
              d = json.load(open('blk.json'))
          except Exception:
              print('not JSON:', open('blk.json').read()[:200]); raise SystemExit
          found = []
          def walk(node, path=''):
              if isinstance(node, dict):
                  for k, v in node.items(): walk(v, path + '/' + str(k))
              elif isinstance(node, list):
                  for i, v in enumerate(node[:2]): walk(v, path + '[' + str(i) + ']')
              elif isinstance(node, str) and re.search(r'image|photo|thumb', path, re.I):
                  found.append((path, node[:120]))
          walk(d)
          print('top-level keys:', sorted(d) if isinstance(d, dict) else type(d))
          for p, v in found[:8]:
              print('  ', p, '=', v)
          if not found:
              print('no image fields; sample:', json.dumps(d)[:400])
          results = (d.get('data') or {}).get('results') or []
          print()
          print('results:', len(results))
          for r in results[:3]:
              if isinstance(r, dict):
                  print('  keys:', sorted(r))
                  print('  cert_number =', r.get('cert_number'), '| grading_company =', r.get('grading_company'))
                  print('  name =', str(r.get('name') or r.get('card_name'))[:70])
          " || true

      - name: Do the picture URLs actually serve?
        env:
          KEY: ${{ secrets.PARSE_API_KEY }}
        run: |
          [ -n "$KEY" ] || exit 0
          [ -s blk.json ] || { echo "no bulk response to read"; exit 0; }
          python3 -c "
          import json
          d = json.load(open('blk.json'))
          urls = []
          for r in (d.get('data') or {}).get('results') or []:
              for k in ('image', 'thumbnail'):
                  v = r.get(k)
                  if isinstance(v, str) and v.startswith('http'):
                      urls.append(k + ' ' + v)
          open('urls.txt', 'w').write(chr(10).join(urls))
          print('found', len(urls), 'picture urls')
          "
          while read -r kind url; do
            [ -n "$url" ] || continue
            code=$(curl -sS -m 30 -o /dev/null -L -w '%{http_code} %{content_type} %{size_download}' "$url" || echo "curl-failed")
            printf '%-10s %s\n            %s\n' "$kind" "$code" "${url:0:110}"
          done < urls.txt

      # The bulk price endpoint returns the newest five sales per cert, which
      # is three months of history on a card that trades monthly — and the app
      # was calling the high of those five a 52-week high. This asks every
      # endpoint that carries sales how deep its history actually goes, so the
      # answer comes from the API rather than from an assumption about it.
      - name: How far back does the sales history go?
        env:
          PROBES: ${{ inputs.probes }}
          KEY: ${{ secrets.PARSE_API_KEY }}
          CERT: ${{ inputs.cert }}
          GRADER: ${{ inputs.grader }}
          CARD_NAME: ${{ inputs.card_name }}
        run: |
          case ",$PROBES," in *,all,*|*,depth,*) ;; *) echo "skipped — not in '$PROBES'"; exit 0 ;; esac
          [ -n "$KEY" ] || exit 0
          # Resolve the scraper here rather than depending on the price probe
          # having run. Listing tasks and reading one are metadata calls and
          # are charged nothing, so a depth-only run no longer has to spend 3
          # credits on a price call it does not want.
          if [ ! -s detail.json ]; then
            curl -sS -m 30 -o tasks.json -H "X-API-Key: $KEY" "$BASE/dispatch/tasks?limit=100" || true
            TASK=$(python3 -c "
          import json, re, sys
          try:
              d = json.load(open('tasks.json'))
          except Exception:
              sys.exit()
          tasks = d.get('tasks', d) if isinstance(d, dict) else d
          for t in tasks:
              if re.search('cardladder', ' '.join(str(t.get(k, '')) for k in ('slug', 'url', 'name')), re.I):
                  print(t.get('id')); sys.exit()
          " || true)
            [ -n "$TASK" ] || { echo "no Card Ladder API on this account"; exit 0; }
            curl -sS -m 30 -o detail.json -H "X-API-Key: $KEY" "$BASE/dispatch/tasks/$TASK" || true
            curl -sS -m 30 -o spec.json -H "X-API-Key: $KEY" \
              "$BASE/v1/apis/$(python3 -c "
          import json
          print(json.load(open('detail.json')).get('result_scraper_id') or '')
          ")/openapi.json" || true
          fi
          SCR=$(python3 -c "
          import json
          try:
              d = json.load(open('detail.json'))
          except Exception:
              print(''); raise SystemExit
          print(d.get('result_scraper_id') or d.get('scraper_id') or '')
          ")
          [ -n "$SCR" ] || { echo "could not resolve the scraper"; exit 0; }
          ONE=$(python3 -c "
          import os
          print([c.strip() for c in os.environ['CERT'].replace(chr(10), ',').split(',') if c.strip()][0])
          ")

          cat > depth.py <<'PY'
          import json, sys, re
          from datetime import datetime, timezone

          def parse(d):
              if not isinstance(d, str): return None
              try:
                  return datetime.fromisoformat(d.replace('Z', '+00:00'))
              except ValueError:
                  return None

          def summarise(label, sales):
              if not isinstance(sales, list) or not sales:
                  print('  %-22s no sales array' % label); return
              dates = sorted(x for x in (parse(s.get('date') or s.get('sale_date') or s.get('sold_date'))
                                         for s in sales if isinstance(s, dict)) if x)
              if not dates:
                  print('  %-22s %d entries, no readable dates' % (label, len(sales))); return
              span = (dates[-1] - dates[0]).days
              age = (datetime.now(timezone.utc) - dates[0]).days
              print('  %-22s %3d sales | oldest %s (%d days ago) | newest %s | spans %d days'
                    % (label, len(sales), dates[0].date(), age, dates[-1].date(), span))

          def dig(node, key):
              """Every list stored under `key`, however deep."""
              out = []
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k == key and isinstance(v, list): out.append(v)
                      else: out.extend(dig(v, key))
              elif isinstance(node, list):
                  for v in node: out.extend(dig(v, key))
              return out

          path, label, key = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              d = json.load(open(path))
          except Exception as e:
              print('  %-22s unreadable (%s)' % (label, e)); raise SystemExit
          lists = dig(d, key)
          if not lists:
              print('  %-22s no "%s" anywhere; top-level keys %s'
                    % (label, key, sorted(d) if isinstance(d, dict) else type(d).__name__))
          for i, sales in enumerate(lists[:3]):
              summarise(label + ('' if len(lists) == 1 else '[%d]' % i), sales)
          PY

          echo "=== what the bulk price call already gave us ==="
          [ -s bulk.json ] && python3 depth.py bulk.json get_cert_values_bulk recent_sales || echo "  no bulk.json"


          # get_cert_full_profile is NOT called here. It costs 10 credits and
          # its answer is already recorded: five sale_records, the same five
          # the bulk calls give. Asking again is paying twice for a settled
          # fact, which is how the balance was emptied last time.
          #
          # The bulk search IS called, for 1 credit, because it is the only
          # place the card id comes from and this step must not depend on the
          # picture probes having been run.
          echo
          echo "=== bulk search, for the card id (1 credit) ==="
          python3 -c "
          import json, os
          certs = [c.strip() for c in os.environ['CERT'].replace(chr(10), ',').split(',') if c.strip()]
          json.dump({'certs': [{'cert_number': c, 'grading_company': os.environ['GRADER']} for c in certs]},
                    open('req2.json', 'w'))
          "
          code=$(curl -sS -m 300 -o blk.json -w '%{http_code}' -D blk.head \
            -X POST -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d @req2.json "$BASE/scraper/$SCR/search_by_certs_bulk" || echo 000)
          echo "  HTTP $code"
          tr -d '\r' < blk.head | grep -iE '^x-credits' | sed 's/^/  /' || true
          python3 depth.py blk.json 'search recent_sales' recent_sales

          echo
          echo "=== get_card_sales: what does it take? ==="
          python3 -c "
          import json
          try:
              d = json.load(open('spec.json'))
          except Exception:
              print('  no spec'); raise SystemExit
          for p, ops in sorted(d.get('paths', {}).items()):
              print(' ', p)
              for verb, op in ops.items():
                  params = [(q.get('name'), q.get('in'), q.get('required')) for q in op.get('parameters', [])]
                  print('   ', verb.upper(), 'params:', params or 'none in spec')
                  body = (op.get('requestBody') or {}).get('content', {})
                  for ct, spec in body.items():
                      print('    body', ct, json.dumps(spec.get('schema'))[:300])
          " || true

          # Both sales endpoints want a `card_id`, and the `id` the bulk search
          # returns is not it — the upstream answered "Card with id ... not
          # found" and named Firestore in the error. The picture URL carries
          # the Firestore document id in its path (.../o/cards%2F<id>?alt=media),
          # so that is the candidate worth trying. Every other id-ish field on
          # a result is printed alongside, in case this guess is wrong.
          echo
          echo "=== every id-ish field the responses carry ==="
          # Written to a file rather than passed with -c: the loop below reads
          # ids.txt, and under `bash -e` a redirect from a file that was never
          # created kills the step outright. An empty file is the safe floor.
          : > ids.txt
          cat > ids.py <<'PY2'
          import json, re, urllib.parse

          # A Firebase storage URL carries the document id of whatever it is a
          # picture of: .../o/<collection>%2F<id>?alt=media. Only the `cards`
          # collection gives a CARD id — a slab whose only photograph came from
          # the auction listing has `sales%2F<slug>`, which is a sale, not a
          # card, and was the reason the first attempt found nothing.
          ranked, other, seen = [], [], set()

          def note(path, value, first):
              if value in seen: return
              seen.add(value)
              (ranked if first else other).append(value)
              print('  %-58s = %s' % (path, value))

          def scan(path, node):
              if isinstance(node, dict):
                  for k, v in node.items(): scan(path + '/' + str(k), v)
              elif isinstance(node, list):
                  for i, v in enumerate(node[:3]): scan(path + '[%d]' % i, v)
              elif isinstance(node, str):
                  m = re.search(r'/o/([^%/]+)%2F([^?/]+)', node)
                  if m:
                      coll, ident = m.group(1), urllib.parse.unquote(m.group(2))
                      note('%s (%s in the picture URL)' % (path, coll), ident, coll == 'cards')
                  elif re.search(r'(^|_)id$', path.rsplit('/', 1)[-1], re.I):
                      note(path, node, False)

          for f in ('blk.json', 'bulk.json'):
              try:
                  scan(f, json.load(open(f)))
              except Exception as e:
                  print('  %-58s (unreadable: %s)' % (f, e))

          # Card ids first: the others are long shots kept only because a
          # refusal costs nothing.
          open('ids.txt', 'w').write(chr(10).join(ranked + other))
          print('  -> %d candidate%s, %d of them card ids'
                % (len(ranked + other), '' if len(ranked + other) == 1 else 's', len(ranked)))
          PY2
          python3 ids.py || true

          while read -r CARD_ID; do
            [ -n "$CARD_ID" ] || continue
            printf '\n  --- GET get_card_sales?card_id=%s ---\n' "$CARD_ID"
            code=$(curl -sS -m 120 -o sales.json -w '%{http_code}' -D sales.head \
              -H "X-API-Key: $KEY" "$BASE/scraper/$SCR/get_card_sales?card_id=$CARD_ID" || echo 000)
            echo "  HTTP $code"
            tr -d '\r' < sales.head | grep -iE '^x-credits-charged' | sed 's/^/  /' || true
            if [ "$code" != "200" ]; then
              head -c 200 sales.json | sed 's/^/  /'; echo
              continue
            fi
            for k in sales sale_records recent_sales results data; do
              python3 depth.py sales.json "get_card_sales/$k" "$k"
            done
            head -c 400 sales.json | sed 's/^/  /'; echo

            # The paginated twin. If a page of 200 comes back full, the depth is
            # however many pages there are, and the five-sale ceiling is gone.
            printf '\n  --- GET get_card_sales_detail?card_id=%s&limit=200&page=1 ---\n' "$CARD_ID"
            code=$(curl -sS -m 120 -o det.json -w '%{http_code}' -D det.head \
              -H "X-API-Key: $KEY" "$BASE/scraper/$SCR/get_card_sales_detail?card_id=$CARD_ID&limit=200&page=1" || echo 000)
            echo "  HTTP $code"
            tr -d '\r' < det.head | grep -iE '^x-credits-charged' | sed 's/^/  /' || true
            if [ "$code" = "200" ]; then
              for k in sales sale_records recent_sales results data; do
                python3 depth.py det.json "get_card_sales_detail/$k" "$k"
              done
              head -c 400 det.json | sed 's/^/  /'; echo
            else
              head -c 200 det.json | sed 's/^/  /'; echo
            fi
            break
          done < ids.txt

          # The lookup that actually matters.
          #
          # A sales history belongs to a CARD AT A GRADE, not to a slab: asking
          # for card_id Zrxi8aY5mAA6roFkKUVX answered with cert 110284828,
          # which is a different slab of the same card. So when a cert carries
          # no card id — and most seem not to — the way in is the card's name,
          # not its certificate. search_cards has never been called.
          if [ -n "$CARD_NAME" ]; then
            # Written to a file, like depth.py, rather than passed with -c.
            # The -c version crashed before printing anything twice running,
            # and each time the run had already paid for the response it then
            # discarded. found.txt is created empty first, because under
            # `bash -e` a redirect from a missing file kills the step and
            # hides whatever went wrong.
            : > found.txt
            cat > cards.py <<'PY3'
          import json, re, sys

          try:
              d = json.load(open('cards.json'))
          except Exception as e:
              print('   response was not JSON:', e)
              print('   raw:', open('cards.json').read()[:400])
              sys.exit()

          print('   top-level keys:', sorted(d) if isinstance(d, dict) else type(d).__name__)
          data = d.get('data') if isinstance(d, dict) else None
          if isinstance(data, dict):
              print('   data keys:', sorted(data))
              for k, v in data.items():
                  if isinstance(v, list):
                      print('   data.%s: %d entries' % (k, len(v)))
                      if v:
                          print('     first entry:', json.dumps(v[0])[:500])
          print('   raw head:', json.dumps(d)[:400])

          hits, seen_ids = [], []
          def walk(n):
              if isinstance(n, dict):
                  for key in ('id', 'card_id', 'cardId', 'slug'):
                      i = n.get(key)
                      if isinstance(i, str) and i:
                          seen_ids.append(key + '=' + i)
                          if not re.fullmatch(r'[0-9a-f]{40}', i):
                              hits.append((i, str(n.get('label') or n.get('name') or '')[:95]))
                  for v in n.values():
                      walk(v)
              elif isinstance(n, list):
                  for v in n[:40]:
                      walk(v)
          walk(d)

          print('   id-ish values seen:', seen_ids[:10] or 'NONE')
          print('   usable card ids:', len(hits))
          for i, label in hits[:10]:
              print('    ', i, '|', label)
          open('found.txt', 'w').write(chr(10).join(i for i, _ in hits[:10]))
          PY3

            printf '\n=== search_cards, by name rather than by cert ===\n'
            printf '  query: %s\n' "$CARD_NAME"
            code=$(curl -sS -m 120 -o cards.json -w '%{http_code}' -D cards.head -G \
              --data-urlencode "query=$CARD_NAME" --data-urlencode "limit=25" \
              -H "X-API-Key: $KEY" "$BASE/scraper/$SCR/search_cards" || echo 000)
            echo "  HTTP $code"
            tr -d '\r' < cards.head | grep -iE '^x-credits-charged' | sed 's/^/  /' || true
            if [ "$code" = "200" ]; then
              python3 cards.py || { echo "  reader failed:"; head -c 400 cards.json | sed 's/^/  /'; echo; }
            else
              head -c 300 cards.json | sed 's/^/  /'; echo
            fi

            while read -r CID; do
              [ -n "$CID" ] || continue
              printf '\n  --- GET get_card_sales?card_id=%s ---\n' "$CID"
              code=$(curl -sS -m 120 -o hist.json -w '%{http_code}' -D hist.head \
                -H "X-API-Key: $KEY" "$BASE/scraper/$SCR/get_card_sales?card_id=$CID" || echo 000)
              echo "  HTTP $code"
              tr -d '\r' < hist.head | grep -iE '^x-credits-charged' | sed 's/^/  /' || true
              [ "$code" = "200" ] || { head -c 200 hist.json | sed 's/^/  /'; echo; continue; }
              python3 - <<'PY4' || true
          import json
          d = json.load(open('hist.json')).get('data', {})
          s = d.get('sales') or []
          print('   ', str(d.get('label', ''))[:95])
          print('    cert quoted:', d.get('cert_number'), '| total_sales:', d.get('total_sales'), '| points:', len(s))
          if s:
              print('    newest:', json.dumps(s[0])[:120])
              print('    oldest:', json.dumps(s[-1])[:120])
          PY4
              break
            done < found.txt
          fi
