# Diagnostic: which query forms does the price API accept?
#
# An error response from this API carries no Access-Control-Allow-Origin
# header, so a browser discards it and reports a bare network failure with no
# status code. A rejected query is therefore indistinguishable, from the page,
# from being blocked outright. This finds which forms are accepted.
#
# Run from the Actions tab → "Price API check" → Run workflow.
name: Price API check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Try each query form
        run: |
          probe() {
            local label="$1"; shift
            # --data-urlencode encodes exactly as the browser's URLSearchParams does.
            local out
            out=$(curl -sS -o /tmp/b.json -w '%{http_code}' --get \
              -H 'Origin: https://michaelgold222.github.io' \
              "$@" 'https://api.pokemontcg.io/v2/cards' 2>&1)
            printf '%-52s -> HTTP %s  %s\n' "$label" "$out" "$(head -c 110 /tmp/b.json | tr -d '\n')"
          }

          echo "=== query forms ==="
          probe 'bare, no params'
          probe 'pageSize only'                  --data-urlencode 'pageSize=1'
          probe 'name unquoted'                  --data-urlencode 'q=name:charizard'
          probe 'name quoted'                    --data-urlencode 'q=name:"charizard"'
          probe 'name quoted + pageSize'         --data-urlencode 'q=name:"charizard"' --data-urlencode 'pageSize=8'
          probe 'name + orderBy releaseDate'     --data-urlencode 'q=name:"charizard"' --data-urlencode 'orderBy=-set.releaseDate'
          probe 'name + orderBy name'            --data-urlencode 'q=name:"charizard"' --data-urlencode 'orderBy=name'
          probe 'name + set.name'                --data-urlencode 'q=name:"charizard" set.name:"Base Set"'
          probe 'name + number'                  --data-urlencode 'q=name:"charizard" number:"4"'
          probe 'name + set.name + number'       --data-urlencode 'q=name:"charizard" set.name:"Base Set" number:"4"'
          probe 'exactly what the app sends'     --data-urlencode 'q=name:"charizard" set.name:"Base Set" number:"4"' --data-urlencode 'pageSize=8' --data-urlencode 'orderBy=-set.releaseDate'

      - name: Do successful responses allow browser calls?
        run: |
          echo "=== headers on a form that works ==="
          curl -sS -D - -o /dev/null --get \
            -H 'Origin: https://michaelgold222.github.io' \
            --data-urlencode 'q=name:"charizard"' --data-urlencode 'pageSize=1' \
            'https://api.pokemontcg.io/v2/cards' \
            | tr -d '\r' | grep -iE '^(HTTP/|access-control-|content-type)' || echo "none matched"
