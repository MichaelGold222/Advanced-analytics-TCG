# Diagnostic: can the dashboard call Parse from the browser?
#
# If it can, the whole server-side path becomes unnecessary: the user pastes
# their own key into the app, uploads a sheet with cert numbers, and prices
# arrive with no secrets, no workflow and no repository involvement.
#
# Run from the Actions tab → "Price API check" → Run workflow.
name: Price API check

on: workflow_dispatch

env:
  BASE: https://api.parse.bot
  ORIGIN: https://michaelgold222.github.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight on the endpoints the dashboard would call
        run: |
          for p in '/dispatch/tasks' '/scraper/x/get_cert_values_bulk'; do
            printf '\n=== OPTIONS %s ===\n' "$p"
            curl -sS -m 20 -D - -o /dev/null -X OPTIONS \
              -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: x-api-key,content-type' \
              "$BASE$p" | tr -d '\r' \
              | grep -iE '^(HTTP/|access-control-)' || echo '  no access-control headers'
          done

      - name: Does a real response carry the header?
        env:
          KEY: ${{ secrets.PARSE_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "no key"; exit 0; }
          echo "=== GET /dispatch/tasks with an Origin ==="
          curl -sS -m 30 -D - -o /dev/null \
            -H "X-API-Key: $KEY" -H "Origin: $ORIGIN" \
            "$BASE/dispatch/tasks?limit=1" | tr -d '\r' \
            | grep -iE '^(HTTP/|access-control-|vary)' || echo '  no access-control headers on the response'

      - name: Verdict
        run: |
          echo
          echo "A browser needs Access-Control-Allow-Origin on BOTH the preflight"
          echo "and the response. Without it the dashboard cannot call Parse"
          echo "directly, whoever holds the key."
