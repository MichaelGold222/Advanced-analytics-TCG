# Diagnostic: what does Card Hedge AI's API actually offer?
#
# The question that decides whether it can drive this dashboard: does it serve
# individual completed sales (date + price, per grade), or only an aggregate
# estimate? The valuation here is a median of the last five real sales, so an
# aggregate alone cannot feed it.
#
# Run from the Actions tab → "Price API check" → Run workflow.
name: Price API check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read the API services page
        run: |
          curl -sSL -o /tmp/api.html -w 'HTTP %{http_code}\n' \
            -H 'User-Agent: Mozilla/5.0' 'https://ai.cardhedger.com/api-services' || true
          echo "=== page text ==="
          sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<style[^>]*>.*<\/style>//g' \
              -e 's/<[^>]*>/ /g' /tmp/api.html \
            | tr -s ' \n' ' \n' | grep -viE '^\s*$' | head -120

      - name: Look for endpoint, auth and pricing mentions
        run: |
          echo "=== URLs and keywords in the page source ==="
          grep -oiE 'https?://[a-z0-9./_-]*(api|docs|developer)[a-z0-9./_-]*' /tmp/api.html | sort -u | head -20
          echo
          for kw in 'sales history' 'sold' 'comps' 'api key' 'bearer' 'oauth' \
                    'rate limit' 'per month' 'pricing' 'endpoint' 'json' 'population'; do
            n=$(grep -oic "$kw" /tmp/api.html | head -1)
            printf '%-16s %s mentions\n' "$kw" "${n:-0}"
          done

      - name: Probe likely API hosts
        run: |
          probe() {
            printf '%-44s -> HTTP %s\n' "$1" \
              "$(curl -sSL -m 12 -o /tmp/p.json -w '%{http_code}' -H 'User-Agent: Mozilla/5.0' "$2" 2>/dev/null || echo unreachable)"
            head -c 200 /tmp/p.json 2>/dev/null; echo; echo
          }
          probe 'api.cardhedger.com'       'https://api.cardhedger.com/'
          probe 'ai.cardhedger.com/api'    'https://ai.cardhedger.com/api'
          probe 'docs'                     'https://ai.cardhedger.com/api-docs'

      - name: Can a browser call it?
        run: |
          curl -sS -D - -o /dev/null -X OPTIONS \
            -H 'Origin: https://michaelgold222.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            'https://ai.cardhedger.com/api-services' | tr -d '\r' \
            | grep -iE '^(HTTP/|access-control-)' || echo "no access-control headers on preflight"
