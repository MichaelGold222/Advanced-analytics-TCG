# Diagnostic: which price sources can actually value graded slabs?
#
# The Pokémon TCG API prices raw singles only. This probes the candidates that
# claim graded coverage, to see what each requires, before any is wired in.
#
# Run from the Actions tab → "Price API check" → Run workflow.
name: Price API check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: PriceCharting - graded singles and sealed
        run: |
          echo "=== product lookup, no token ==="
          curl -sS -o /tmp/pc.json -w 'HTTP %{http_code}\n' \
            'https://www.pricecharting.com/api/product?t=&q=charizard+base+set' || true
          head -c 500 /tmp/pc.json; echo
          echo
          echo "=== does it serve CORS to a browser? ==="
          curl -sS -D - -o /dev/null -X OPTIONS \
            -H 'Origin: https://michaelgold222.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            'https://www.pricecharting.com/api/product' | tr -d '\r' \
            | grep -iE '^(HTTP/|access-control-)' || echo "no CORS headers on preflight"

      - name: PSA - auction prices realized
        run: |
          echo "=== PSA public API, no token ==="
          curl -sS -o /tmp/psa.json -w 'HTTP %{http_code}\n' \
            'https://api.psacard.com/publicapi/cert/GetByCertNumber/12345678' || true
          head -c 300 /tmp/psa.json; echo

      - name: eBay - browse API reachability
        run: |
          echo "=== eBay browse API, no token ==="
          curl -sS -o /tmp/ebay.json -w 'HTTP %{http_code}\n' \
            'https://api.ebay.com/buy/browse/v1/item_summary/search?q=charizard+psa+10&limit=1' || true
          head -c 300 /tmp/ebay.json; echo

      - name: Does the current source carry any grade data at all?
        run: |
          echo "=== full record for one card, looking for graded fields ==="
          curl -sS --get -H 'Origin: https://michaelgold222.github.io' \
            --data-urlencode 'q=name:"charizard" set.name:"Base Set"' --data-urlencode 'pageSize=1' \
            'https://api.pokemontcg.io/v2/cards' -o /tmp/p.json -w 'HTTP %{http_code}\n' || true
          echo "price-related keys present:"
          grep -oE '"(psa|bgs|cgc|graded|grade)[a-zA-Z0-9]*"' /tmp/p.json | sort -u || echo "  none — raw prices only"
          echo "tcgplayer price variants offered:"
          python3 -c "
import json,sys
try:
    d=json.load(open('/tmp/p.json'))
    c=d['data'][0]
    print(' ', list((c.get('tcgplayer') or {}).get('prices',{}).keys()) or 'none')
except Exception as e:
    print('  could not parse:', e)
"
