# Discover exactly what the Card Ladder API returns, using the account key.
#
# From Parse's platform spec: auth is an X-API-Key header, endpoints execute
# at GET /scraper/{scraper_id}/{endpoint_name}, and each API publishes its own
# OpenAPI document at /v1/apis/{scraper_id}/openapi.json.
#
# This finds the scraper id, reads that API's schema, and makes one real call,
# so the provider is written against observed fields rather than guessed ones.
#
# Needs a repository secret named PARSE_API_KEY.
# Run from the Actions tab → "Price API check" → Run workflow.
name: Price API check

on: workflow_dispatch

env:
  BASE: https://api.parse.bot

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Is the key present?
        run: |
          if [ -z "${{ secrets.PARSE_API_KEY }}" ]; then
            echo "PARSE_API_KEY is not set."
            echo "Add it: repo Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "Key is present (value never printed)."

      - name: Find the Card Ladder API and its scraper id
        env:
          KEY: ${{ secrets.PARSE_API_KEY }}
        run: |
          curl -sSL -m 30 -H "X-API-Key: $KEY" "$BASE/dispatch/tasks?limit=100" -o /tmp/tasks.json \
            -w 'HTTP %{http_code}\n'
          echo "=== every field on the task record ==="
          jq -r '(.tasks // .items // .data // .) | if type=="array" then .[0] else . end' /tmp/tasks.json 2>/dev/null | head -60

          TASK=$(jq -r '(.tasks // .items // .data // .) | if type=="array" then .[] else . end
                        | select((.slug // .name // .url // "") | test("cardladder"; "i")) | .id' \
                 /tmp/tasks.json 2>/dev/null | head -1)
          echo "task id: ${TASK:-none}"
          [ -n "$TASK" ] || exit 0

          echo
          echo "=== task detail, where the scraper id should live ==="
          curl -sSL -m 30 -H "X-API-Key: $KEY" "$BASE/dispatch/tasks/$TASK" -o /tmp/task.json \
            -w 'HTTP %{http_code}\n'
          jq -r 'paths(scalars) as $p | "\($p | join(".")) = \(getpath($p) | tostring | .[0:70])"' /tmp/task.json 2>/dev/null \
            | grep -iE 'id|slug|endpoint|status|url' | head -40

          # The scraper id is its own field; the task id is not interchangeable.
          jq -r '.scraper_id // .scraper.id // .api_id // empty' /tmp/task.json 2>/dev/null | head -1 > /tmp/sid
          echo "scraper id: $(cat /tmp/sid 2>/dev/null || echo 'not found')"

          echo
          echo "=== endpoint names this API exposes ==="
          jq -r '[.. | objects | select(has("name")) | .name] | unique | .[]' /tmp/task.json 2>/dev/null | head -20 || true

      - name: Read that API's own schema
        env:
          KEY: ${{ secrets.PARSE_API_KEY }}
        run: |
          SID=$(cat /tmp/sid 2>/dev/null)
          [ -n "$SID" ] || { echo "no scraper id; stopping"; exit 0; }
          curl -sSL -m 30 -H "X-API-Key: $KEY" "$BASE/v1/apis/$SID/openapi.json" -o /tmp/api.json \
            -w 'HTTP %{http_code}\n'
          echo "=== endpoints ==="
          jq -r '.paths | to_entries[] | .key as $p | (.value | to_entries[] | "\(.key|ascii_upcase) \($p) — \(.value.summary // "")")' /tmp/api.json 2>/dev/null | head -30
          echo
          echo "=== parameters of the sales and cert endpoints ==="
          jq -r '.paths | to_entries[] | select(.key | test("sales|cert"; "i")) | .key as $p
                 | (.value | to_entries[] | "\($p): " + ((.value.parameters // []) | map("\(.name)\(if .required then "*" else "" end)") | join(", ")))' \
            /tmp/api.json 2>/dev/null | head -20

      - name: One real call, printed
        env:
          KEY: ${{ secrets.PARSE_API_KEY }}
        run: |
          SID=$(cat /tmp/sid 2>/dev/null)
          [ -n "$SID" ] || exit 0
          echo "=== search_cards: charizard ==="
          curl -sSL -m 45 -H "X-API-Key: $KEY" \
            --get --data-urlencode 'query=Charizard Base Set' --data-urlencode 'limit=3' \
            "$BASE/scraper/$SID/search_cards" -o /tmp/s.json -w 'HTTP %{http_code}\n'
          jq '.' /tmp/s.json 2>/dev/null | head -60 || head -c 1200 /tmp/s.json
          echo
          echo "=== top-level keys, and whether any card id came back ==="
          jq -r 'if type=="object" then (keys|join(", ")) else "array of \(length)" end' /tmp/s.json 2>/dev/null || true
          jq -r '.. | objects | select(has("id")) | .id' /tmp/s.json 2>/dev/null | head -3 > /tmp/cardid || true
          echo "first card id: $(head -1 /tmp/cardid 2>/dev/null || echo none)"

      - name: Do we get individual sales with dates?
        env:
          KEY: ${{ secrets.PARSE_API_KEY }}
        run: |
          SID=$(cat /tmp/sid 2>/dev/null); CID=$(head -1 /tmp/cardid 2>/dev/null)
          [ -n "$SID" ] && [ -n "$CID" ] || { echo "need a card id first"; exit 0; }
          echo "=== get_card_sales for card $CID ==="
          curl -sSL -m 45 -H "X-API-Key: $KEY" \
            --get --data-urlencode "card_id=$CID" \
            "$BASE/scraper/$SID/get_card_sales" -o /tmp/sales.json -w 'HTTP %{http_code}\n'
          jq '.' /tmp/sales.json 2>/dev/null | head -70 || head -c 1500 /tmp/sales.json
          echo
          echo "=== field names that look like a sale record ==="
          jq -r '[.. | objects | keys[]] | unique | .[]' /tmp/sales.json 2>/dev/null \
            | grep -iE 'date|price|sold|grade|amount|auction|source' | head -20 || echo "  none"
