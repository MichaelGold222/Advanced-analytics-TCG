# Diagnostic: can Card Hedge's API drive this dashboard?
#
# Decisive question: does it return individual completed sales (date + price,
# per grade), or only an aggregate estimate? The valuation here is a median of
# the last five real sales, so an aggregate alone cannot feed it.
#
# Run from the Actions tab → "Price API check" → Run workflow.
name: Price API check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read the API documentation page
        run: |
          curl -sSL -o /tmp/docs.html -H 'User-Agent: Mozilla/5.0' 'https://api.cardhedger.com/' || true
          echo "=== readable text ==="
          sed -e ':a' -e 'N' -e '$!ba' -e 's/<script[^>]*>[^<]*<\/script>/ /g' /tmp/docs.html \
            | sed -e 's/<[^>]*>/\n/g' \
            | sed -e 's/&amp;/\&/g' -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&quot;/"/g' -e 's/&#39;/'"'"'/g' \
            | grep -vE '^[[:space:]]*$' | head -150

      - name: What does the search endpoint say without a key?
        run: |
          for url in \
            'https://cardhedge-api.com/v1/cards/search?q=charizard' \
            'https://cardhedge-api.com/v1/' \
            'https://cardhedge-api.com/'; do
            printf '\n=== %s ===\n' "$url"
            curl -sSL -m 15 -o /tmp/r.json -w 'HTTP %{http_code}\n' \
              -H 'User-Agent: Mozilla/5.0' "$url" || echo unreachable
            head -c 400 /tmp/r.json; echo
          done

      - name: Hunt for a sales-history endpoint
        run: |
          echo "=== endpoint paths mentioned in the docs ==="
          grep -oiE '/v[0-9]+/[a-z0-9/_{}-]+' /tmp/docs.html | sort -u | head -40
          echo
          echo "=== keyword counts in the docs ==="
          for kw in 'sales history' 'sales_history' 'recent sales' 'last sale' \
                    'sold' 'transaction' 'psa' 'grade' 'population' 'price'; do
            printf '%-16s %s\n' "$kw" "$(grep -oic "$kw" /tmp/docs.html || echo 0)"
          done

      - name: Can a browser call the API host directly?
        run: |
          curl -sS -D - -o /dev/null -X OPTIONS \
            -H 'Origin: https://michaelgold222.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization' \
            'https://cardhedge-api.com/v1/cards/search' | tr -d '\r' \
            | grep -iE '^(HTTP/|access-control-)' \
            || echo "no access-control headers -> needs a server to relay, like eBay"
