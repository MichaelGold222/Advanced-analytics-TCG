# Diagnostic: how does Parse expose a generated API's endpoints?
#
# Its platform spec is reachable, but the guessed call paths 404. This lists
# every path the spec declares plus its auth scheme, so the real pattern for
# calling "cardladder-com-api / search_cards" comes from the spec rather than
# from guesswork.
#
# Run from the Actions tab → "Price API check" → Run workflow.
name: Price API check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Capture the spec
        run: |
          for u in 'https://api.parse.bot/openapi.json' 'https://docs.parse.bot/openapi.json'; do
            code=$(curl -sSL -m 20 -o /tmp/s.json -w '%{http_code}' "$u" 2>/dev/null || echo err)
            printf '%-40s -> %s (%s bytes)\n' "$u" "$code" "$(wc -c < /tmp/s.json)"
            if jq -e '.paths' /tmp/s.json >/dev/null 2>&1; then cp /tmp/s.json /tmp/spec.json; echo "  ^ valid OpenAPI"; fi
          done

      - name: Every path, with its summary
        run: |
          [ -s /tmp/spec.json ] || { echo "no spec"; exit 0; }
          jq -r '.servers // [] | .[] | "server: \(.url)"' /tmp/spec.json
          echo
          jq -r '.paths | to_entries[] | .key as $p | (.value | to_entries[] | "\(.key|ascii_upcase) \($p)  — \(.value.summary // "")")' /tmp/spec.json

      - name: Auth scheme
        run: |
          [ -s /tmp/spec.json ] || exit 0
          echo "=== securitySchemes ==="
          jq -r '.components.securitySchemes // {} | to_entries[] | "\(.key): type=\(.value.type) in=\(.value.in // "-") name=\(.value.name // "-") scheme=\(.value.scheme // "-")"' /tmp/spec.json
          echo
          echo "=== anything mentioning slug, api_id or endpoint in a path ==="
          jq -r '.paths | keys[]' /tmp/spec.json | grep -iE 'slug|api|endpoint|call|run|invoke|\{' || echo "  none matched"

      - name: Try the documented shapes unauthenticated
        run: |
          for u in 'https://api.parse.bot/api/cardladder-com-api/search_cards?query=charizard' \
                   'https://api.parse.bot/apis/cardladder-com-api/search_cards?query=charizard' \
                   'https://api.parse.bot/cardladder-com-api/endpoints/search_cards?query=charizard' \
                   'https://cardladder-com-api.parse.bot/search_cards?query=charizard'; do
            printf '%-72s -> ' "$u"
            curl -sSL -m 20 -o /tmp/r.json -w '%{http_code}\n' "$u" 2>/dev/null || echo err
            head -c 160 /tmp/r.json 2>/dev/null; echo
          done
