# Diagnostic: read Parse's REST contract from its own documentation.
#
# Parse (parse.bot) fronts the Card Ladder API this project wants. Nothing is
# written against it until its real URL pattern, auth header and response
# shape are read from the docs rather than guessed.
#
# Run from the Actions tab → "Price API check" → Run workflow.
name: Price API check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Plain-text documentation, if published
        run: |
          for u in 'https://docs.parse.bot/llms-full.txt' \
                   'https://docs.parse.bot/llms.txt' \
                   'https://docs.parse.bot/openapi.json' \
                   'https://api.parse.bot/openapi.json'; do
            code=$(curl -sSL -m 20 -o /tmp/d.txt -w '%{http_code}' "$u" 2>/dev/null || echo err)
            size=$(wc -c < /tmp/d.txt 2>/dev/null || echo 0)
            printf '%-44s -> %s  (%s bytes)\n' "$u" "$code" "$size"
            if [ "$code" = "200" ] && [ "$size" -gt 400 ]; then cp /tmp/d.txt /tmp/best.txt; echo "  ^ kept"; fi
          done

      - name: The parts that define the contract
        run: |
          if [ ! -s /tmp/best.txt ]; then echo "nothing captured"; exit 0; fi
          echo "=== lines mentioning the REST call shape ==="
          grep -inE 'api\.parse\.bot|X-API-Key|curl |https://api|/v[0-9]+/|endpoint|base url|authorization' /tmp/best.txt \
            | head -60
          echo
          echo "=== first 120 lines ==="
          head -120 /tmp/best.txt

      - name: Fall back to the rendered docs page
        run: |
          if [ -s /tmp/best.txt ]; then echo "already have text"; exit 0; fi
          curl -sSL -m 20 -o /tmp/docs.html -H 'User-Agent: Mozilla/5.0' 'https://docs.parse.bot' || true
          tr '\n' ' ' < /tmp/docs.html \
            | sed -e 's/<style[^>]*>[^<]*<\/style>/ /g' -e 's/<[^>]*>/\n/g' \
            | grep -vE '^[[:space:]]*$' | head -100

      - name: What does the API host say unauthenticated?
        run: |
          for u in 'https://api.parse.bot/' \
                   'https://api.parse.bot/cardladder-com-api/search_cards?query=charizard' \
                   'https://api.parse.bot/v1/cardladder-com-api/search_cards?query=charizard'; do
            printf '\n=== %s ===\n' "$u"
            curl -sSL -m 20 -o /tmp/r.json -w 'HTTP %{http_code}\n' "$u" 2>/dev/null || echo err
            head -c 300 /tmp/r.json 2>/dev/null; echo
          done
