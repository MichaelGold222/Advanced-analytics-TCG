# Diagnostic: how fast can the price API be called before it starts refusing?
#
# Its failures return instantly and carry no Access-Control-Allow-Origin
# header, so a browser discards them and reports a bare network error with no
# status. Throttling is therefore indistinguishable, from the page, from being
# blocked outright. This measures the rate the API actually tolerates.
#
# Run from the Actions tab → "Price API check" → Run workflow.
name: Price API check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Burst vs paced
        run: |
          NAMES="charizard blastoise venusaur pikachu mewtwo umbreon lugia gengar snorlax eevee"

          run_at() {
            local gap="$1" ok=0 fail=0
            for n in $NAMES; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --get \
                -H 'Origin: https://michaelgold222.github.io' \
                --data-urlencode "q=name:\"$n\"" --data-urlencode 'pageSize=8' \
                'https://api.pokemontcg.io/v2/cards')
              if [ "$code" = "200" ]; then ok=$((ok+1)); else fail=$((fail+1)); fi
              printf '%s ' "$code"
              [ -n "$gap" ] && sleep "$gap"
            done
            printf '\n  -> %s ok, %s failed\n\n' "$ok" "$fail"
          }

          echo "=== 10 requests back to back (what the app did) ==="
          run_at ""
          echo "=== 10 requests, 0.5s apart ==="
          run_at 0.5
          echo "=== 10 requests, 1.2s apart ==="
          run_at 1.2

      - name: Does a retry after a pause recover?
        run: |
          echo "=== hammer until refused, then wait and retry ==="
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --get \
              -H 'Origin: https://michaelgold222.github.io' \
              --data-urlencode 'q=name:"charizard"' 'https://api.pokemontcg.io/v2/cards')
            echo "burst $i -> $code"
            [ "$code" != "200" ] && break
          done
          echo "waiting 5s..."
          sleep 5
          code=$(curl -sS -o /dev/null -w '%{http_code}' --get \
            -H 'Origin: https://michaelgold222.github.io' \
            --data-urlencode 'q=name:"charizard"' 'https://api.pokemontcg.io/v2/cards')
          echo "after pause -> $code"
