# Fetch sold comps, build the dashboard, publish it.
#
# Runs daily so prices stay current without anyone touching anything.
#
# The fetch needs two secrets: PARSE_API_KEY and PORTFOLIO_CERTS, the latter
# being lines like "PSA 12345678". The cert list is a secret rather than a file
# because this repository is public and a collection sheet carries cost basis;
# secrets are encrypted and never published. The feed that ships with the site
# holds only certificate numbers and public sale prices.
#
# Without either secret the fetch is skipped and the dashboard still deploys:
# a pricing hiccup must never take the site down.
#
# One-time setup, repository admin only: Settings → Pages → Source →
# "GitHub Actions".
name: Deploy dashboard

on:
  push:
    branches: [claude/determined-gates-pl6w4q]
  schedule:
    # 06:20 UTC daily. Off the hour, since everything runs at :00.
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Fetch sold comps
        id: prices
        # Never block the deploy: a stale feed beats no dashboard.
        continue-on-error: true
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
          PORTFOLIO_CERTS: ${{ secrets.PORTFOLIO_CERTS }}
        run: |
          if [ -z "$PARSE_API_KEY" ]; then
            echo "No PARSE_API_KEY; keeping whatever feed is committed."
            exit 0
          fi
          if [ -z "$PORTFOLIO_CERTS" ]; then
            echo "No PORTFOLIO_CERTS; nothing to price."
            echo "Add it as a repository secret: lines like 'PSA 12345678'."
            exit 0
          fi
          npx tsx scripts/fetch-prices.ts

      - name: Archive the feed, so the record outlives the subscription
        continue-on-error: true
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/prices.json 2>/dev/null || exit 0
          git diff --staged --quiet && { echo "feed unchanged"; exit 0; }
          git commit -m 'Update sold-comp feed' \
                     -m 'Written by the scheduled price fetch. Sales come from Card Ladder via Parse, keyed by certificate number.'
          # A GITHUB_TOKEN push does not retrigger workflows, so this cannot loop.
          git push origin HEAD:${GITHUB_REF_NAME}

      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
