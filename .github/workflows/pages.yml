# Publishes the dashboard to GitHub Pages.
#
# A page served over https has a normal origin and may call the price API. A
# page opened from a file does not and may not, which is why the standalone
# .html cannot fetch live prices however it is opened.
#
# One-time setup, which only a repository admin can do: Settings → Pages →
# Source → "GitHub Actions". The workflow token is not permitted to create the
# Pages site itself ("Resource not accessible by integration"), so this step
# cannot be automated away.
name: Deploy dashboard

on:
  push:
    branches: [claude/determined-gates-pl6w4q]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
